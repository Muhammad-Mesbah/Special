<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحبيبتي ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b0b3a;--bg2:#7a1a4a;--rose:#ff5c8a;--soft:#ffd6e3;--paper:#fff6ef;--ink:#5a2a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#ff8fab55,transparent 45%),radial-gradient(circle at 85% 90%,#c77dff44,transparent 50%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--soft);font-family:'Tajawal',system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.scene{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:70px 20px 40px;text-align:center}
.scene.on{display:flex;animation:fade .9s ease}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
h1,h2{font-family:'Amiri',serif;font-weight:700;color:#fff}
h1{font-size:clamp(30px,8vw,52px)}h2{font-size:clamp(26px,6vw,38px)}
.hint{opacity:.75;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
button.main{background:linear-gradient(135deg,#ff5c8a,#ff8fab);color:#fff;border:0;border-radius:999px;padding:14px 34px;font:700 18px 'Tajawal',sans-serif;cursor:pointer;box-shadow:0 8px 30px #ff5c8a66;transition:transform .2s}
button.main:active{transform:scale(.95)}
/* envelope */
.env{position:relative;width:260px;height:170px;background:#e8456f;border-radius:6px;cursor:pointer;animation:float 3s ease-in-out infinite;box-shadow:0 20px 50px #0008}
@keyframes float{50%{transform:translateY(-12px)}}
.env .flap{position:absolute;top:0;left:0;width:100%;height:100%;background:#ff6b93;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:3}
.env .front{position:absolute;inset:0;background:#d63a63;clip-path:polygon(0 100%,50% 40%,100% 100%,100% 100%,0 100%);z-index:2}
.env .note{position:absolute;left:12%;right:12%;top:10%;height:80%;background:var(--paper);border-radius:4px;transition:transform 1s .5s;z-index:1}
.env .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;z-index:4;transition:opacity .3s}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg);z-index:0}.env.open .note{transform:translateY(-90px)}.env.open .seal{opacity:0}
/* letter */
.paper{background:var(--paper);color:var(--ink);max-width:560px;width:100%;border-radius:14px;padding:34px 26px;font:400 19px/2 'Amiri',serif;text-align:right;box-shadow:0 25px 60px #0009;min-height:260px;position:relative}
.paper::before{content:"❦";position:absolute;top:8px;left:16px;color:#e8456f;font-size:22px}
.cur::after{content:"|";animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:520px;width:100%}
.pol{background:#fff;padding:10px 10px 8px;border-radius:4px;box-shadow:0 10px 30px #0008;transform:rotate(var(--r));transition:transform .3s;cursor:pointer;color:#6b3a4a;font:700 15px 'Amiri',serif}
.pol:nth-child(1){--r:-4deg}.pol:nth-child(2){--r:3deg}.pol:nth-child(3){--r:2deg}.pol:nth-child(4){--r:-3deg}
.pol:hover{transform:rotate(0) scale(1.06);z-index:2}
.pol .ph{aspect-ratio:1;background:#ffe3ec;display:grid;place-items:center;font-size:34px;overflow:hidden;border-radius:2px;margin-bottom:8px}
.pol img{width:100%;height:100%;object-fit:cover}
/* final */
.big{font:700 clamp(60px,18vw,110px)/1 'Amiri',serif;color:var(--rose);animation:beat 1.2s infinite}
@keyframes beat{14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.15)}70%{transform:scale(1)}}
.days{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.days div{background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:12px 18px;min-width:78px}
.days b{display:block;font-size:30px;color:#fff}
.fl{position:fixed;z-index:9;pointer-events:none;font-size:26px;animation:up 1.8s ease-out forwards}
@keyframes up{to{transform:translate(var(--x),-260px) scale(1.6) rotate(var(--rot));opacity:0}}
/* music */
.bar{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;gap:8px}
.bar button,.bar label{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:8px 14px;font:14px 'Tajawal',sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
h1,h2{background:linear-gradient(90deg,#fff,#ffb3c9,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}@keyframes sh{to{background-position:200% 0}}
.pol:nth-child(odd){--r:-3deg}.pol:nth-child(even){--r:3deg}
.pl{position:fixed;z-index:11;top:calc(58px + env(safe-area-inset-top,0px));left:12px;width:min(320px,calc(100vw - 24px));background:#2b0b3aee;border:1px solid #ffffff33;border-radius:18px;padding:16px;backdrop-filter:blur(10px);display:none;box-shadow:0 20px 50px #000a}
.pl.show{display:block;animation:fade .4s}
.pl h3{font:700 22px 'Amiri',serif;margin-bottom:8px;color:#fff}
.tr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#fff;text-decoration:none;margin-top:6px;background:#ffffff14;transition:background .2s}
.tr:active{background:#ff5c8a55}.tr span{opacity:.6;width:18px}.tr b{flex:1;font-size:15px}.tr i{font-style:normal;color:#ff8fab}

.lane{display:flex;flex-direction:column;gap:38px;width:100%;max-width:400px;align-items:center;padding:10px 0 20px}
.card{position:relative;background:#fff;color:#6b3a4a;padding:12px 12px 16px;border-radius:6px;box-shadow:0 14px 40px #0009;width:100%;opacity:0;transform:translateY(70px) rotate(var(--r)) scale(.92);transition:all .9s cubic-bezier(.2,.8,.2,1);text-align:center}
.card.in{opacity:1;transform:rotate(var(--r))}
.card img{width:100%;display:block;border-radius:3px;margin-bottom:10px}
.card b{font:700 23px 'Amiri',serif;display:block;color:#c2185b}
.card p{font:400 17px/1.8 'Amiri',serif;margin-top:4px}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:#ffd6e3cc;transform:rotate(-3deg);box-shadow:0 2px 6px #0004}
.tr{cursor:pointer}.tr.on{background:#ff5c8a66}
.pc{display:flex;justify-content:center;gap:14px;margin-top:14px}
.pc button{background:#ff5c8a;border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.pbar{height:4px;background:#ffffff33;border-radius:4px;margin-top:12px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:#ff8fab}
.pl small{display:block;margin-top:8px;opacity:.75;font-size:13px;text-align:center}
.card.gold{background:linear-gradient(145deg,#fff9e6,#fff);box-shadow:0 0 0 3px #f5c76a,0 0 36px #ffd27aaa,0 14px 40px #0009;animation:glow 2.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffd98a,0 0 60px #ffd27a,0 14px 40px #0009}}
.card.gold::after{content:"✨ ذكرى مميزة ✨";position:absolute;top:-17px;right:12px;background:linear-gradient(90deg,#f5c76a,#ffb347);color:#5a1236;font:700 13px 'Tajawal',sans-serif;padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px #0005}
.pt{position:fixed;top:-30px;z-index:9;pointer-events:none;font-size:22px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
.rc{perspective:800px;height:165px;cursor:pointer}
.rc>div{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.rc.f>div{transform:rotateY(180deg)}
.rc .a,.rc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center}
.rc .a{background:linear-gradient(135deg,#ff5c8a,#c77dff);color:#fff;font:700 19px 'Amiri',serif;box-shadow:0 10px 26px #0006}.rc .a span{font-size:36px}
.rc .b{background:var(--paper);color:var(--ink);transform:rotateY(180deg);font:400 15px/1.7 'Amiri',serif;box-shadow:0 10px 26px #0006}
.ov{position:fixed;inset:0;z-index:20;background:#1a0526ee;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.ov.on{display:flex;animation:fade .6s}
.ln{margin-bottom:12px;opacity:0;animation:fade 1s forwards}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="bar"><button id="mus">🔊</button></div><div class="pl" id="pl"><h3>🎶 أغانينا 🥰</h3><div id="tl"></div><div class="pc"><button id="pv">⏮</button><button id="pp">▶</button><button id="pn">⏭</button></div><div class="pbar"><i id="pf"></i></div><small id="pt"></small><input id="tf" type="file" accept="audio/*" hidden></div>

<section class="scene on" id="s0">
  <h1 id="hi"></h1>
  <p class="hint">في حاجة صغيرة جهزتهالك…</p>
  <div class="env" id="env"><div class="note"></div><div class="front"></div><div class="flap"></div><div class="seal">❤</div></div>
  <p class="hint">اضغطي على الرسالة</p>
</section>

<section class="scene" id="s1">
  <div class="paper"><span id="txt" class="cur"></span></div>
  <button class="main" id="n1" style="display:none">كمّلي ❤</button>
</section>

<section class="scene" id="s2">
  <h2>حكايتنا بالصور 🫶🏻</h2>
  <p class="hint">انزلي براحة… كل صورة وراها حكاية 💞</p>
  <div class="lane" id="lane"></div>
  <button class="main" id="n2">كمّلي ❤</button>
</section>

<section class="scene" id="sR">
  <h2>ليه بحبك؟ 🥰</h2>
  <p class="hint">دوسي على كل كارت وشوفي السبب 💞</p>
  <div class="rg" id="rg"></div>
  <button class="main" id="nR">كمّلي ❤</button>
</section>

<section class="scene" id="s3">
  <h2>بقالنا مع بعض 🥰</h2>
  <div class="days"><div><b id="d1">0</b>يوم</div><div><b id="d2">0</b>ساعة</div><div><b id="d3">0</b>دقيقة</div></div>
  <div class="big">❤</div>
  <h2 id="end"></h2>
  <button class="main" id="love">بحبك قد إيه؟ 😘</button>
  <button class="main" id="sec" style="display:none">💌 في كلمة أخيرة ليكي</button>
</section>

<div class="ov" id="ov"><div class="paper"><div id="sm"></div><button class="main" id="cl" style="margin-top:16px">❤ بحبك</button></div></div>

<script>
// ===== عدّلي هنا =====
const HER_NAME = "ميويتي";
const NICKS = ["ميويتي","يويا","غزالتي","روحي"];
const START = new Date("2026-03-21T00:00:00"); // تاريخ بدايتكم (21/3)
const LETTER = "إلى ميويتي أجمل حاجة حصلتلي…\n\nأولاً أنا آسف، حقك عليا إني محضرتش الإيفنت، بس كنت تعبان أوي أوي وربنا يعلم قد إيه كان نفسي أكتبلك الرسالة دي. سامحيني بليز 🫂\n\nمش عارف أبدأ منين، بس عارف إن من يوم ما دخلتي حياتي كل حاجة بقت أحلى. صوت ضحكتك بتصلّح يومي، ووجودك جنبي بيحسسني بالأمان وإن في دايماً شخص مؤمن بيا وعارف وواثق إني هوصل. دايماً حنينة عليا وطيبة في تعاملك.\n\nبحبك وانتي بتحكيلي همومك ومشاكلك، بحبك وانتي بتعاتبيني على أي حاجة، بحبك وانتي مهتمة بيا وبتفاصيلي. والله بحبك في كل حالاتك، بحبك أكتر من أي حد في الدنيا دي، والله أكتر من نفسي كمان.\n\nشكراً إنك أنتِ، وإنك اخترتيني. وعد مني أفضل جنبك دايماً طول العمر، ووالله محدش في الدنيا دي يقدر ياخد ذرة من مكانك، وهتفضلي عندي رقم واحد. ويارب أعيش وأحققلك كل اللي بتتمنيه. ♥";
const ENDING = "بحبك يا ميويتي… وهفضل أحبك كل يوم أكتر ♥";

hi.textContent="أهلاً يا "+NICKS[0]+" ❤";ni=1;setInterval(nick,2800);

function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}

function out(){const a=ac();if(!bus){bus=a.createGain();bus.gain.value=.9;const d=a.createDelay(1),fb=a.createGain(),lp=a.createBiquadFilter();d.delayTime.value=.3;fb.gain.value=.32;lp.type="lowpass";lp.frequency.value=2600;bus.connect(a.destination);bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(a.destination)}return bus}
function pluck(f,t0,v,d,at){const a=ac(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator(),o2=a.createOscillator(),g2=a.createGain();at=at||.012;
 o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;g2.gain.value=.25;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0008,t+d);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(out());o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
const PENT=[523.25,587.33,659.25,783.99,880];
const SFX={
 click(){pluck(PENT[Math.floor(Math.random()*5)],0,.05,.9)},
 open(){[392,523.25,659.25,783.99,1046.5].forEach((f,i)=>pluck(f,i*.17,.06,1.8))},
 sparkle(){[659.25,783.99,987.77,1318.5].forEach((f,i)=>pluck(f,i*.1,.045,1.3))},
 chord(){[261.63,329.63,392,493.88].forEach((f,i)=>pluck(f,i*.12,.04,3.2,.35))}
};
function sfx(n){if(!SND)return;try{SFX[n]()}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.id!=="sec")sfx(b.id==="love"?"sparkle":"click")});

// floating hearts background
const cv=$("fx"),cx=cv.getContext("2d");let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<35;i++)P.push({e:["❤","😘","🫰🏻","🫶🏻","🥰"][i%5],x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:14+Math.random()*20,v:.3+Math.random()*.8,o:.15+Math.random()*.35,p:Math.random()*6});
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 P.forEach(h=>{h.y-=h.v;h.p+=.02;h.x+=Math.sin(h.p)*.5;if(h.y<-30){h.y=cv.height+30;h.x=Math.random()*cv.width}
  cx.globalAlpha=h.o;cx.fillStyle="#ff5c8a";cx.font=h.s+"px serif";cx.fillText(h.e,h.x,h.y)});
 requestAnimationFrame(loop)})();

// envelope -> letter
let opened=false;
$("env").onclick=()=>{if(opened)return;opened=true;$("env").classList.add("open");sfx("open");
 setTimeout(()=>{show(1);type()},1900)};
function type(){const el=$("txt");let i=0,done=false;
 const fin=()=>{done=true;el.textContent=LETTER;el.classList.remove("cur");$("n1").style.display="block";rain()};
 (function step(){if(done)return;if(i>=LETTER.length)return fin();
  el.innerHTML=LETTER.slice(0,++i).replace(/\n/g,"<br>");setTimeout(step,32)})();
 $("n1").onclick=()=>show(2);
 el.parentElement.onclick=()=>{if(!done)fin()}}

["أول لقاء","أول مرة اتقابلنا… ومن ساعتها مفيش حاجة رجعت زي ما كانت 🫰🏻"],
["أمانك عندي","طول ما أنا جنبك، مفيش حاجة في الدنيا تقدر تخوّفك… أنا سندك وضهرك وأمانك 🥰"],
["قلبنا على البحر","قلبين على البحر… والبحر نفسه غار مننا 🌊🫶🏻"],
["ليلة السينما","مكانش فارق الفيلم، كنت بتفرج عليكي أنتي 🍿😘"],

["جودي 🐰","وانتي جودي… أحلى أرنوبة في الدنيا 🥰"],
["يوم الورد","الورد حلو، بس انتي أحلى منه بكتير 🌹😘"],

MEM.forEach((m,i)=>{const c=document.createElement("div");c.className="card"+(i===8?" gold":"");c.style.setProperty("--r",(i%2?2.5:-2.5)+"deg");
 c.innerHTML='<i class="tape"></i><img src="'+IMGS[i]+'" alt=""><b>'+m[0]+'</b><p>'+m[1]+'</p>';$("lane").appendChild(c)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);if(e.target.classList.contains("gold"))petals()}}),{threshold:.2});
document.querySelectorAll(".card").forEach(c=>io.observe(c));
$("n2").onclick=()=>{show(3);rain()};
$("nR").onclick=()=>{show(4);tick();rain()};
function rain(){const E=["❤","😘","🫰🏻","🫶🏻","🥰"];
 for(let i=0;i<34;i++){const s=document.createElement("span");s.className="fl";s.textContent=E[i%5];
  s.style.left=(Math.random()*92+2)+"%";s.style.top=(innerHeight*(.45+Math.random()*.5))+"px";
  s.style.setProperty("--x",(Math.random()*80-40)+"px");s.style.setProperty("--rot",(Math.random()*60-30)+"deg");
  s.style.animationDelay=(Math.random()*1.6)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}

// counter
function tick(){const ms=Date.now()-START,m=Math.floor(ms/6e4);
 $("d1").textContent=Math.floor(m/1440);$("d2").textContent=Math.floor(m/60);$("d3").textContent=m;setTimeout(tick,1e4)}

// heart burst
$("love").onclick=e=>{const r=e.target.getBoundingClientRect();
 for(let i=0;i<18;i++){const s=document.createElement("span");s.className="fl";s.textContent=["❤","😘","🫰🏻","🫶🏻","🥰","💕"][i%6];
  s.style.left=(r.left+r.width/2)+"px";s.style.top=r.top+"px";
  s.style.setProperty("--x",(Math.random()*240-120)+"px");s.style.setProperty("--rot",(Math.random()*80-40)+"deg");
  s.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}};

// reasons (flip cards)
const WHY=[["😊","ضحكتك","بتصلّح يومي من أول ثانية، وصوتها بيفضل معايا طول اليوم"],["🫶🏻","حنيتك","حنينة عليا وطيبة في كل تعاملك، وده حاجة نادرة"],["🌟","إيمانك بيا","مؤمنة بيا وواثقة إني هوصل، وده خلاني أصدّق نفسي"],["🥰","اهتمامك","مهتمة بيا وبأصغر تفاصيلي، حتى اللي أنا نفسي بنساها"],["😘","عتابك","حتى وانتي بتعاتبيني بحس إن ده من كتر حبك ليا"],["🫂","ثقتك فيا","بتحكيلي همومك ومشاكلك، وده أغلى حاجة عندي"],["🤍","أمانك","وجودك جنبي بيحسسني إن الدنيا بخير"],["❤","إنتي","ببساطة… عشان انتي انتي، ومفيش زيك في الدنيا"]];
$("rg").innerHTML=WHY.map(w=>'<div class="rc"><div><div class="a"><span>'+w[0]+'</span>'+w[1]+'</div><div class="b">'+w[2]+'</div></div></div>').join("");
$("rg").onclick=e=>{const c=e.target.closest(".rc");if(c)c.classList.toggle("f")};
// petals + secret message
function petals(){for(let i=0;i<22;i++){const s=document.createElement("span");s.className="pt";s.textContent=["🌹","🌸","❤"][i%3];s.style.left=Math.random()*96+"%";s.style.animationDuration=(4+Math.random()*3)+"s";s.style.animationDelay=(Math.random()*2.5)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),9000)}}
const SECRET=["ميويتي… لو وصلتي لهنا يبقى لسه عندي كلمة أخيرة ليكي 🤍","مهما حصل ومهما الدنيا اتغيرت، هتفضلي أول واحدة بفكر فيها أول ما أصحى، وآخر واحدة قبل ما أنام.","وعد مني… عمري ما هسيبك تحسي إنك لوحدك، وهفضل أمانك وسندك مهما كان.","بحبك يا يويا… بحبك يا غزالتي… بحبك يا روحي ❤","— بتاعك دايماً 🫶🏻"];
$("love").addEventListener("click",()=>{$("sec").style.display="block"});
$("sec").onclick=()=>{$("sm").innerHTML="";SECRET.forEach((t,i)=>{const p=document.createElement("p");p.className="ln";p.textContent=t;p.style.animationDelay=(i*1.4)+"s";$("sm").appendChild(p)});$("ov").classList.add("on");sfx("chord");rain()};
$("cl").onclick=()=>$("ov").classList.remove("on");
// player (songs live inside the page)
const TRACKS=[{t:"هي وبتحلي الدنيا في عيني",src:null},{t:"سيبني أقولك بحبك ليه",src:null},{t:"إنت عيونك دوبوني",src:null},{t:"Die With A Smile",src:null}];
let ti=-1,pick=0;const au=new Audio();
function drawTL(){$("tl").innerHTML=TRACKS.map((t,i)=>'<div class="tr'+(i===ti?' on':'')+'" data-i="'+i+'"><span>'+(i+1)+'</span><b>'+t.t+'</b><i>'+(i===ti&&!au.paused?'⏸':'▶')+'</i></div>').join("");$("pp").textContent=au.paused?"▶":"⏸"}
function play(i){const t=TRACKS[i];if(!t.src){pick=i;$("tf").click();return}
 if(i===ti){au.paused?au.play():au.pause();return}
 ti=i;au.src=t.src;au.play().catch(()=>{});$("pt").textContent="🎶 "+t.t;drawTL()}
$("tl").onclick=e=>{const r=e.target.closest(".tr");if(r)play(+r.dataset.i)};
$("pp").onclick=()=>play(ti<0?0:ti);
$("pn").onclick=()=>play((ti+1)%TRACKS.length);
$("pv").onclick=()=>play((ti-1+TRACKS.length)%TRACKS.length);
$("tf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{TRACKS[pick].src=r.result;play(pick)};r.readAsDataURL(f);e.target.value=""};
au.onplay=au.onpause=drawTL;
au.ontimeupdate=()=>{$("pf").style.width=(au.duration?au.currentTime/au.duration*100:0)+"%"};
au.onended=()=>{for(let k=1;k<=TRACKS.length;k++){const j=(ti+k)%TRACKS.length;if(TRACKS[j].src){play(j);return}}};
$("mus").onclick=()=>{SND=!SND;$("mus").textContent=SND?"🔊":"🔇"};
$("pt").textContent="اختاري أغنية 🎶";drawTL();
</script>
</body>
</html>
